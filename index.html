<html lang="en">
  <head>

    <!-- Tailwind CSS  -->
    <link href="/dist/main.css" rel="stylesheet" />
    <link href="/src/css/main.css" rel="stylesheet" />

    <style>
      #home-body .site-nav {
        position: sticky;
        top: 0;
        z-index: 80;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(10px);
        background: rgba(4, 18, 22, 0.55);
      }

      #home-body .site-nav::after {
        content: "";
        display: block;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(73, 220, 205, 0.5), transparent);
      }

      #home-body .content-shell {
        width: min(1160px, calc(100% - clamp(1rem, 4vw, 2.5rem)));
        margin: 0 auto;
      }

      #home-body .nav-wrap {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        min-height: 72px;
      }

      #home-body .brand-link {
        display: inline-flex;
        align-items: center;
        border-radius: 12px;
        outline: none;
      }

      #home-body .brand-link:focus-visible {
        box-shadow: 0 0 0 3px rgba(73, 220, 205, 0.28);
      }

      #home-body .brand-link img {
        filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.28));
      }

      #home-body .nav-links-desktop {
        display: none;
        align-items: center;
        gap: 0.45rem;
        margin: 0;
        padding: 0.35rem;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(8px);
        list-style: none;
      }

      #home-body .nav-chip {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #e4f8f4;
        text-decoration: none;
        font-size: 0.85rem;
        font-weight: 600;
        line-height: 1;
        padding: 0.62rem 0.95rem;
        border-radius: 999px;
        border: 1px solid transparent;
        transition: all 220ms ease;
        text-transform: none;
      }

      #home-body .nav-chip:hover {
        color: #fff;
        border-color: rgba(73, 220, 205, 0.5);
        background: rgba(73, 220, 205, 0.14);
      }

      #home-body .nav-chip[aria-current="page"] {
        color: #022126;
        border-color: rgba(73, 220, 205, 0.8);
        background: linear-gradient(135deg, #14b8a6, #0f9d95);
        box-shadow: 0 10px 24px rgba(20, 184, 166, 0.25);
      }

      #home-body .nav-toggle {
        color: #e9fbf8;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 12px;
        padding: 0.42rem;
      }

      #home-body #mobile-menu {
        background: rgba(4, 18, 22, 0.86);
        backdrop-filter: blur(10px);
      }

      #home-body .mobile-links {
        list-style: none;
        margin: 0;
        padding: 0.75rem;
        display: grid;
        gap: 0.45rem;
      }

      #home-body .mobile-link {
        display: block;
        color: #e8f8f6;
        text-decoration: none;
        font-size: 0.95rem;
        font-weight: 600;
        border-radius: 10px;
        padding: 0.7rem 0.85rem;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.03);
        transition: all 220ms ease;
      }

      #home-body .mobile-link:hover {
        border-color: rgba(73, 220, 205, 0.5);
        background: rgba(73, 220, 205, 0.14);
      }

      #home-body .mobile-link[aria-current="page"] {
        color: #032025;
        border-color: rgba(73, 220, 205, 0.8);
        background: linear-gradient(135deg, #14b8a6, #0f9d95);
      }

      #home-body {
        min-height: 100vh;
        min-height: 100dvh;
        overflow-x: hidden;
        display: flex;
        flex-direction: column;
      }

      #home-body .home-container {
        min-height: 100%;
        flex: 1 0 auto;
        display: flex;
        flex-direction: column;
      }

      #home-body .website-content {
        min-height: 100vh;
        flex: 1 0 auto;
        display: flex;
        flex-direction: column;
      }

      #home-body nav {
        padding: 0.75rem clamp(0.75rem, 3vw, 1.5rem);
      }

      #home-body .hero {
        position: relative !important;
        top: auto !important;
        transform: none !important;
        padding: clamp(2.5rem, 10vh, 7rem) clamp(1rem, 4vw, 2rem) clamp(1.8rem, 6vh, 3.5rem);
      }

      #home-body .hero .h1 h1 {
        text-align: center;
        font-family: "Syne", sans-serif;
        font-weight: 700;
        letter-spacing: -0.04em;
        color: #f3fcfa;
        text-shadow: 0 0 32px rgba(73, 220, 205, 0.12);
        font-size: clamp(2rem, 8vw, 5.5rem);
      }

      #home-body .hero .h1 h1 span {
        color: #49dccd;
      }

      #home-body footer {
        position: static !important;
        right: auto !important;
        bottom: auto !important;
        width: min(1160px, calc(100% - clamp(1rem, 4vw, 2.5rem)));
        margin-inline: auto;
        justify-content: center;
        align-items: center;
        gap: 0.7rem;
        padding: 0.95rem;
        border-top: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 18px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.01)),
          rgba(4, 18, 22, 0.72);
        backdrop-filter: blur(16px);
        box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.18);
        margin-top: auto;
      }

      #home-body .item {
        width: min(104px, 21vw);
        height: min(104px, 21vw);
        border-radius: 14px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
      }

      #home-body .item img {
        border-radius: 10px;
      }

      @media (max-width: 768px) {
        #home-body .hero .h1 h1 {
          font-size: clamp(1.75rem, 11vw, 3rem);
          line-height: 1.03;
        }

        #home-body footer {
          flex-wrap: wrap;
          padding: 0.8rem;
        }
      }

      @media (min-width: 640px) {
        #home-body .nav-links-desktop {
          display: flex;
        }
      }
    </style>

      <!-- Swiper.js CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.css">

  <!-- Swiper.js JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.js" defer></script>
  </head>

          <div class="img">

      <div class="website-content">
        <header class="site-nav">
        <nav class="content-shell nav-wrap" aria-label="Main navigation">
          <a href="index.html" class="brand-link" aria-label="Go to homepage">
            <img class="logo !w-16 !h-auto sm:!w-20 md:!w-24 lg:!w-32" src="src/images/logo.png" alt="Mansa Leaf Productions logo" />
          </a>
        
          <!-- Toggle Button (Hidden on larger screens) -->
          <div class="block sm:hidden">
            <button id="mobile-menu-toggle" type="button" aria-expanded="false" class="nav-toggle focus:outline-none focus:ring-2 focus:ring-inset focus:ring-white">
              <span class="sr-only">Open main menu</span>
              <svg class="w-12 h-12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
              </svg>
            </button>
          </div>
    
        
          <!-- Nav Links (Hidden on small screens, visible on desktop) -->
          <ul class="nav-links-desktop" role="list">
            <li><a href="index.html" class="nav-chip" aria-current="page">Home</a></li>
            <li><a href="about.html" class="nav-chip">About</a></li>
            <li><a href="about.html#projects" class="nav-chip">Projects</a></li>
            <li><a href="contact.html" class="nav-chip">Contact</a></li>
          </ul>
        </nav>
        
        <!-- Mobile Menu (Hidden by default) -->
        <div id="mobile-menu" class="sm:hidden hidden bg-transparent">
          <ul class="mobile-links">
            <li><a href="index.html" class="mobile-link" aria-current="page">Home</a></li>
            <li><a href="about.html" class="mobile-link">About</a></li>
            <li><a href="about.html#projects" class="mobile-link">Projects</a></li>
            <li><a href="contact.html" class="mobile-link">Contact</a></li>
          </ul>
        </div>
        </header>

        <div class="hero">
          <div class="h1">
            <h1>Visuals That Inspire</h1>
          </div>
          <div class="h1">

          </div>
          <div class="h1">
            <h1><span>that Transform</span></h1>
          </div>
        </div>

        <footer>
          <div class="item">
            <img src="/src/images/homeimg1.png" alt="" />
          </div>
          <div class="item">
            <img src="/src/images/homeimg2.png" alt="" />
          </div>
          <div class="item">
            <img src="/src/images/homeimg3.png" alt="" />
          </div>
          <div class="item">
            <img src="/src/images/homeimg4.png" alt="" />
          </div>
        </footer>
      </div>
    </div>

    <!-- Custom JS -->
    <script src="/src/js/main.js"></script>
  </body>
</html>
